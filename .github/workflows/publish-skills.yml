name: Publish Skills

on:
  push:
    branches:
      - main
    paths:
      - "SKILL.md"
      - "skills/**"
      - ".agents/skills/**"
      - ".claude/skills/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check SKILL.md files are in sync
        run: |
          if ! diff -q SKILL.md skills/fleece/SKILL.md > /dev/null 2>&1; then
            echo "ERROR: SKILL.md and skills/fleece/SKILL.md are out of sync"
            diff SKILL.md skills/fleece/SKILL.md
            exit 1
          fi
          echo "SKILL.md files are in sync"

      - name: Lint SKILL.md frontmatter
        run: |
          python3 - <<'EOF'
          import re, sys
          with open("SKILL.md") as f:
              content = f.read()
          match = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
          if not match:
              print("ERROR: No YAML frontmatter found in SKILL.md")
              sys.exit(1)
          for line in match.group(1).splitlines():
              if line.startswith("description:") and ('"' in line or "'" in line):
                  print(f"ERROR: Embedded quotes in description field break YAML parsers: {line}")
                  sys.exit(1)
          print("Frontmatter OK")
          EOF

  publish-clawhub:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Install clawhub
        run: npm install -g clawhub

      - name: Authenticate
        run: clawhub login --token "${{ secrets.CLAWHUB_TOKEN }}" --no-browser

      - name: Publish to ClawHub
        run: clawhub sync --root .agents/skills --all --changelog "Automated publish from ${{ github.sha }}"
